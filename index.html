    else if (m.siwar === 'logout') { TK = ''; try { localStorage.removeItem('siwar_tk'); } catch (e) {} }
    else if (m.siwar === 'nav') { DEPTH = +m.depth || 0; document.getElementById('bk').classList.toggle('on', DEPTH > 0); if (DEPTH > 0 && !PUSHED) { PUSHED = true; try { history.pushState({ s: 1 }, ''); } catch (e) {} } }
    else if (m.siwar === 'open') go(m.page === 'comm' ? 'comm' : 'home');
  });
  function start() {
    if (!navigator.onLine) { document.getElementById('msg').style.display='none'; document.querySelector('.dots').style.display='none'; document.getElementById('off').style.display='block'; return; }
    if (APP_URL.indexOf('script.google.com') < 0) { document.getElementById('msg').textContent = 'لم يُضبط رابط النظام في ملف index.html'; return; }
    F = document.createElement('iframe'); F.allow = 'clipboard-write'; F.title = 'SIWAR Analysis';
    document.body.appendChild(F); go('home');
  }
  window.addEventListener('online', function () { if (document.getElementById('off').style.display === 'block') location.reload(); });
  window.addEventListener('offline', function () { var sp = document.getElementById('splash'); if (sp.style.display === 'none' || sp.style.opacity === '0') { showSplash('انقطع الاتصال بالإنترنت'); document.querySelector('.dots').style.display = 'none'; var off = document.getElementById('off'); off.innerHTML = 'انقطع الاتصال بالإنترنت. تُعرض البيانات الحديثة عند عودته.<br><button onclick="location.reload()">إعادة المحاولة</button>'; off.style.display = 'block'; } });
  start();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
